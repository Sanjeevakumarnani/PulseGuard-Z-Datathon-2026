name: Deploy PulseGuard Z to IBM LinuxONE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulseguard-linuxone-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PULSEGUARD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PULSEGUARD_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing PULSEGUARD_SSH_KEY secret"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing PULSEGUARD_SSH_KNOWN_HOSTS secret"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over verified SSH
        env:
          SSH_HOST: ${{ secrets.PULSEGUARD_SSH_HOST }}
          SSH_USER: ${{ secrets.PULSEGUARD_SSH_USER }}
        run: |
          set -eu
          test -n "$SSH_HOST" || { echo "Missing PULSEGUARD_SSH_HOST secret"; exit 1; }
          test -n "$SSH_USER" || { echo "Missing PULSEGUARD_SSH_USER secret"; exit 1; }
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y git python3 python3-venv python3-pip

          if [ ! -d /opt/PulseGuard-Z-Datathon-2026/.git ]; then
            sudo git clone https://github.com/Sanjeevakumarnani/PulseGuard-Z-Datathon-2026.git /opt/PulseGuard-Z-Datathon-2026
          else
            sudo git -C /opt/PulseGuard-Z-Datathon-2026 pull --ff-only
          fi

          sudo python3 -m venv /opt/PulseGuard-Z-Datathon-2026/.venv
          sudo /opt/PulseGuard-Z-Datathon-2026/.venv/bin/python -m pip install --upgrade pip
          sudo /opt/PulseGuard-Z-Datathon-2026/.venv/bin/pip install -r /opt/PulseGuard-Z-Datathon-2026/requirements.txt
          sudo install -d -o linux1 -g linux1 /var/lib/pulseguard
          sudo tee /etc/systemd/system/pulseguard.service >/dev/null <<'UNIT'
          [Unit]
          Description=PulseGuard Z API and dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=linux1
          Group=linux1
          WorkingDirectory=/opt/PulseGuard-Z-Datathon-2026
          Environment=PYTHONUNBUFFERED=1
          Environment=PULSEGUARD_DB=/var/lib/pulseguard/pulseguard.db
          ExecStart=/opt/PulseGuard-Z-Datathon-2026/.venv/bin/uvicorn app:app --host 127.0.0.1 --port 8000
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo systemctl daemon-reload
          sudo systemctl enable --now pulseguard
          sudo systemctl restart pulseguard
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health
          REMOTE
